- id: flashinfer.attention.merge_state
  display_name: "Attention Merge State"
  category: ATTENTION
  framework: flashinfer
  match:
    qualified_exact: ["flashinfer::MergeStateKernel"]
  confidence: medium
  source:
    repository: sglang
    path: python/sglang/srt/layers/attention/flashinfer_backend.py
    symbol: FlashInferBackend.forward
    description: "Merges attention output states (e.g. across splits)."

- id: flashinfer.attention.merge_states_persistent
  display_name: "Attention Merge States (Persistent)"
  category: ATTENTION
  framework: flashinfer
