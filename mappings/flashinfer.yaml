    symbol: FlashInferBackend.forward
    description: "FlashInfer batch prefill attention over ragged KV cache."

- id: flashinfer.attention.prefill_decode
  display_name: "Attention (Prefill+Decode)"
  category: ATTENTION
  framework: flashinfer
  match:
    qualified_exact: ["flashinfer::BatchPrefillDecodeKVCacheKernel"]
  confidence: high
  source:
    repository: sglang
    path: python/sglang/srt/layers/attention/flashinfer_backend.py
    symbol: FlashInferBackend.forward
