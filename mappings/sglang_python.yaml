# SGLang Python-level function mappings.
#
# These map Python profiler events (category: python_function) to semantic
# categories. Event names have the format:
#   sglang/srt/<path>.py(<line>): <function_name>
#
# We match on the file path portion using `contains` matching.
# More specific paths must appear before more general ones.

