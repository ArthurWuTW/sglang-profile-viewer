# Base mapping rules: generic PyTorch / cuBLAS / CUDA runtime events.
#
# Match strategy precedence (highest first):
#   exact > qualified_exact > regex > contains / contains_any
# Within the same strategy, the rule that appears first in load order wins.
# Load order: base.yaml, then remaining files in sorted path order.

# ---------------------------------------------------------------- Linear / GEMM
- id: base.linear.aten
  display_name: "Linear (aten)"
  category: LINEAR
  framework: pytorch
  match:
    exact:
      - "aten::linear"
      - "aten::mm"
      - "aten::addmm"
      - "aten::bmm"
      - "aten::baddbmm"
      - "aten::matmul"
      - "aten::mv"
      - "aten::dot"
  confidence: high
  source:
    repository: sglang
    path: python/sglang/srt/layers/linear.py
    symbol: Linear
    description: >
      Dense linear projection. In a transformer layer this GEMM is one of
      qkv_proj / o_proj / gate_up_proj / down_proj; the kernel name alone does
      not encode which one.

- id: base.gemm.cublas
  display_name: "GEMM (cuBLAS)"
  category: LINEAR
  framework: cublas
  match:
    contains_any:
      - "gemm"
      - "gemv"
  confidence: medium
  source:
    repository: sglang
    path: python/sglang/srt/layers/linear.py
    symbol: Linear
    description: >
      cuBLAS dense GEMM/GEMV kernel (linear projection). The template name does
      not encode which projection (qkv / o / gate_up / down).

